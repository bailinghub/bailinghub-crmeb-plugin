name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl, zip
          coverage: none

      - name: Set up Node.js for embedded JavaScript checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Composer metadata
        if: matrix.php == '8.3'
        run: composer validate --strict --no-check-publish

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src scripts tests webinstaller config -type f -name '*.php' -print0)

      - name: Run standalone contract and security tests
        shell: bash
        env:
          MATRIX_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          for test_file in tests/*_test.php; do
            if [[ "$MATRIX_PHP" == "7.1" && "$(basename "$test_file")" == "release_artifact_verifier_test.php" ]]; then
              continue
            fi
            php "$test_file"
          done

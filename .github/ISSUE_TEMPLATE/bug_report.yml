name: Bug 报告
description: 报告可重复的安装、配置或使用问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先升级到最新正式版本，并移除日志、截图中的 token、签名密钥、Cookie 和真实业务数据。

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 例如 2.4.1
    validations:
      required: true

  - type: input
    id: crmeb-version
    attributes:
      label: CRMEB 产品线与版本
      placeholder: 例如 CRMEB-KY v6.0.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP 版本
      placeholder: 例如 PHP 8.3.30
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 安装方式
      options:
        - 网页安装整包
        - ZIP 命令行安装
        - Composer / 私有制品库
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明你原本想完成什么，以及实际发生了什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      placeholder: |
        1. 进入……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图
      description: 不要提交 token、签名密钥、Cookie、管理员身份信息或真实业务数据。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已在最新正式版本上复现该问题。
          required: true
        - label: 我已移除所有秘密和真实业务数据。
          required: true
        - label: 这不是一个尚未修复的安全漏洞；安全问题将通过私密入口报告。
          required: true

